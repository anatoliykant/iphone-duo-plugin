name: Version consistency

# Both hosts share skills and audit references. Keep their manifests, marketplace entries,
# skill version answers and release tags consistent.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions-agree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate Claude Code and Codex packaging
        run: python3 scripts/validate-plugin.py
